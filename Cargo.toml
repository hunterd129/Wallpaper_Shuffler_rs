[package]
name = "Wallpaper_Shuffler"
version = "1.2.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
toml = "0.8"
walkdir = "2.4"
dirs = "5.0"
notify-rust = "4.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = true
