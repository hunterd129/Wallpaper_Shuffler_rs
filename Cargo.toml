[package]
name = "wall_shuff"
version = "1.3.1"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
toml = "0.8"
walkdir = "2.4"
dirs = "5.0"
notify-rust = "4.0"
ksni = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }

[target.'cfg(target_os = "linux")'.dependencies]
which = "6.0"

[profile.release]
opt-level = 3
strip = true
